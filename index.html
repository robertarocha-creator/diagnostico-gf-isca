<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico de gestão financeira — Nibo</title>
<!-- Favicon do Nibo: suba um arquivo "favicon.png" (recomendado 32x32 ou
     64x64px, fundo transparente) na MESMA pasta do index.html no GitHub.
     Se preferir usar .ico em vez de .png, troque o href e o type abaixo. -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script charset="utf-8" src="https://js.hsforms.net/forms/embed/v2.js"></script>
<style>
  :root{
    --navy:#002D72; --blue:#0072CE; --sky:#41B6E6; --ice:#B8CCEA; --pink:#FF40B3;
    --text:#2C2C2A; --muted:#002D72; --bg:#F5F8FD; --border:#E5EDF7; --border-strong:#D6E1F0;
    --shadow-sm:0 1px 2px rgba(0,45,114,.04), 0 2px 8px rgba(0,45,114,.05);
    --shadow-md:0 2px 4px rgba(0,45,114,.05), 0 8px 24px rgba(0,45,114,.08);
    --radius-lg:20px; --radius-md:16px; --radius-sm:12px; --radius-form:15px;
    --green:#0e8b52;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:"Poppins",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  header{background:#fff;border-bottom:1px solid var(--border);padding:14px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  header .brand{display:flex;align-items:center;gap:12px;}
  header img{height:26px;width:auto;display:block;max-width:120px;}
  header .tag{font-size:12.5px;color:var(--navy);font-weight:500;letter-spacing:.01em;}
  @media (max-width:640px){header{padding:10px 20px;} header img{height:20px;} header .tag{font-size:10.5px;}}

  .page{max-width:1120px;margin:0 auto;padding:0 40px;}
  @media (max-width:640px){.page{padding:0 20px;}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:"Poppins",Arial,sans-serif;font-weight:600;border-radius:12px;cursor:pointer;transition:all .18s ease;border:1px solid transparent;white-space:nowrap;text-decoration:none;}
  .btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}
  .btn-primary{background:var(--blue);color:#fff;padding:16px 32px;font-size:16px;border:none;}
  .btn-primary:hover{background:var(--navy);}
  .btn-secondary{background:#fff;color:var(--blue);border:1px solid var(--blue);padding:12px 20px;font-size:14px;}
  .btn-secondary:hover{background:#EEF5FE;}
  .btn-ghost{background:transparent;color:var(--muted);padding:10px 16px;font-size:14px;font-weight:500;border:1px solid transparent;}
  .btn-ghost:hover{color:var(--navy);background:#EEF5FE;}
  @media (max-width:640px){.btn-primary{width:100%;padding:16px 24px;}}

  .intro-wrap{padding:40px 0 48px;}
  .intro-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;}
  .intro h1{font-family:"Poppins",Arial,sans-serif;font-size:32px;font-weight:600;color:var(--navy);line-height:1.25;margin:0 0 14px;letter-spacing:-.01em;}
  .intro-lead{font-size:15.5px;color:rgba(0,45,114,.72);font-weight:400;line-height:1.55;margin:0 0 26px;max-width:440px;}
  .intro-benefits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:30px 0 0;max-width:460px;}
  .benefit{
    display:inline-flex;align-items:center;gap:9px;background:#fff;padding:10px 16px 10px 10px;
    border-radius:100px;border:1px solid var(--border);box-shadow:var(--shadow-sm);
    font-size:13px;color:var(--navy);font-weight:500;transition:transform .15s ease, box-shadow .15s ease;
  }
  .benefit:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .benefit .chip{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--blue);color:#fff;font-size:12px;
  }
  .benefit:nth-child(2) .chip{background:var(--navy);}
  .benefit:nth-child(3) .chip{background:var(--pink);}
  .benefit:nth-child(4) .chip{background:var(--sky);}
  @media (max-width:480px){.intro-benefits{grid-template-columns:1fr;}}

  .hero-visual-col{display:flex;align-items:center;justify-content:center;}
  .hero-visual{
    width:100%; max-width:440px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-visual-img{
    width:100%; height:auto; max-height:440px;
    object-fit:contain; display:block;
  }
  @media (max-width:820px){.intro-grid{grid-template-columns:1fr;gap:32px;} .intro h1{font-size:28px;} .intro-lead{max-width:none;} .intro-wrap{padding:28px 0 40px;} .hero-visual{max-width:320px;}}
  @media (max-width:640px){.intro h1{font-size:24px;} .intro-lead{font-size:14.5px;} .hero-visual{max-width:260px;margin-top:8px;}}

  .quiz-wrap{padding:48px 0;}
  .quiz-card{max-width:680px;margin:0 auto;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:36px;}
  @media (max-width:640px){.quiz-wrap{padding:24px 0;} .quiz-card{padding:24px 20px;border-radius:16px;}}
  .quiz-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:500;}
  .progress{height:6px;background:#EDF3FA;border-radius:6px;overflow:hidden;margin-bottom:28px;}
  .progress-fill{height:100%;background:var(--blue);border-radius:6px;transition:width .35s ease;}
  .quiz-q{font-size:22px;font-weight:600;color:var(--navy);margin:0 0 24px;line-height:1.38;}
  @media (max-width:640px){.quiz-q{font-size:19px;}}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:56px;padding:14px 18px;background:#fff;border:1.5px solid var(--border);border-radius:12px;font-family:"Poppins",Arial,sans-serif;font-size:15px;color:var(--navy);cursor:pointer;transition:all .18s ease;line-height:1.4;}
  .opt:hover{border-color:var(--sky);background:#F7FBFF;}
  .opt:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-color:var(--blue);}
  .opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ice);flex-shrink:0;position:relative;transition:all .18s ease;}
  .opt.selected{border-color:var(--blue);background:#EEF5FE;}
  .opt.selected .radio{border-color:var(--blue);background:var(--blue);}
  .opt.selected .radio::after{content:'';position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);}
  .opt-text{flex:1;}
  .quiz-nav{display:flex;justify-content:flex-start;margin-top:18px;}

  .processing-wrap{max-width:540px;margin:0 auto;padding:64px 20px;text-align:center;}
  .processing-title{font-size:21px;font-weight:600;color:var(--navy);margin:0 0 8px;}
  .processing-subtitle{font-size:13.5px;color:var(--muted);margin:0 0 30px;}
  .proc-steps{display:flex;flex-direction:column;gap:10px;text-align:left;max-width:420px;margin:0 auto;}
  .proc-step{display:flex;align-items:center;gap:14px;padding:13px 18px;background:#fff;border-radius:12px;border:1px solid var(--border);font-size:13.5px;color:var(--muted);transition:all .3s ease;}
  .proc-step .indicator{width:22px;height:22px;border-radius:50%;flex-shrink:0;background:#EDF3FA;display:flex;align-items:center;justify-content:center;transition:all .3s ease;position:relative;color:#fff;font-size:11px;}
  .proc-step .indicator i{font-size:10px;color:var(--muted);}
  .proc-step.active .indicator i,.proc-step.done .indicator i{color:#fff;}
  .proc-step.active{color:var(--navy);border-color:var(--sky);background:#F7FBFF;box-shadow:0 2px 10px rgba(0,114,206,.08);}
  .proc-step.active .indicator{background:var(--blue);}
  .proc-step.active .indicator::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
  .proc-step.done{color:var(--navy);border-color:var(--border);background:#F7FBFF;}
  .proc-step.done .indicator{background:var(--navy);}
  .proc-step.done .indicator::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-60%) rotate(45deg);width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;}
  .proc-progress-track{height:4px;background:#EDF3FA;border-radius:4px;overflow:hidden;max-width:420px;margin:22px auto 0;}
  .proc-progress-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));border-radius:4px;transition:width .4s ease;}

  .lead-gate-wrap{padding:28px 0 60px;}
  .lead-gate-card{max-width:560px;margin:0 auto;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:40px 36px;text-align:center;}
  .lead-gate-eyebrow{font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:0 0 14px;}
  .lead-gate-title{font-family:"Poppins",Arial,sans-serif;font-size:24px;font-weight:600;color:var(--navy);line-height:1.3;margin:0 0 14px;}
  .lead-gate-lead{font-size:14.5px;color:rgba(0,45,114,.72);line-height:1.6;margin:0 0 28px;}
  .lead-gate-status{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--navy);font-size:14.5px;font-weight:500;padding:20px 0;}
  .lead-gate-status i{color:var(--blue);font-size:16px;}
  .lead-gate-success{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--navy);font-size:15.5px;font-weight:600;padding:20px 0;}
  .lead-gate-success i{color:var(--blue);font-size:20px;}
  .lead-gate-error-wrap{padding:8px 0;}
  .lead-gate-error{color:var(--navy);font-size:14px;line-height:1.6;margin:0 0 18px;}
  /* Botões da tela de lead gate (ex.: "Tentar novamente") usam o raio do formulário,
     sem alterar o raio padrão de .btn usado no restante do site. */
  #lead-form-section .btn{border-radius:var(--radius-form);}
  @media (max-width:640px){.lead-gate-card{padding:28px 22px;} .lead-gate-title{font-size:20px;}}

  /* ===== Formulário HubSpot (lead gate) — identidade visual Nibo =====
     1) Variáveis oficiais do HubSpot Forms (--hsf-*), usadas pelo renderer
        atual de formulários em HTML quando o portal já adota esse padrão.
     2) Fallback com classes públicas do HubSpot (.hs-form, .hs-input etc.)
        para portais/temas que ainda usam a marcação legada dos formulários.
     Nada aqui altera campos, validações, consentimento, formId/portalId/
     region, callback de sucesso ou fluxo de desbloqueio — só aparência. */
  #diagnosisLeadForm{
    --hsf-global__font-family:"Poppins",Arial,sans-serif;
    --hsf-global__font-size:14px;
    --hsf-global__color:#002D72;

    --hsf-background__background-color:#FFFFFF;
    --hsf-background__border-width:0;
    --hsf-background__padding:0;

    --hsf-row__vertical-spacing:18px;

    --hsf-field-label__font-family:"Poppins",Arial,sans-serif;
    --hsf-field-label__color:#002D72;
    --hsf-field-description__color:#002D72;

    --hsf-field-input__font-family:"Poppins",Arial,sans-serif;
    --hsf-field-input__color:#002D72;
    --hsf-field-input__background-color:#FFFFFF;
    --hsf-field-input__placeholder-color:#B8CCEA;
    --hsf-field-input__border-color:#B8CCEA;
    --hsf-field-input__border-width:1px;
    --hsf-field-input__border-style:solid;
    --hsf-field-input__border-radius:var(--radius-form);
    --hsf-field-input__padding:14px 16px;

    --hsf-button__font-family:"Poppins",Arial,sans-serif;
    --hsf-button__font-size:15px;
    --hsf-button__color:#FFFFFF;
    --hsf-button__background-color:#0072CE;
    --hsf-button__border-radius:var(--radius-form);
    --hsf-button__padding:15px 24px;
    --hsf-button__box-shadow:none;

    --hsf-richtext__font-family:"Poppins",Arial,sans-serif;
    --hsf-richtext__color:#002D72;

    text-align:left;
  }
  /* Fallback para marcação legada (portal sem suporte a --hsf-*) */
  #diagnosisLeadForm .hs-form,
  #diagnosisLeadForm form{background:transparent;border:0;box-shadow:none;padding:0;margin:0;text-align:left;}
  #diagnosisLeadForm .hs-form-field{margin:0 0 var(--hsf-row__vertical-spacing,18px);text-align:left;}
  #diagnosisLeadForm .hs-form-field label,
  #diagnosisLeadForm label{
    display:block;font-family:"Poppins",Arial,sans-serif;font-size:14px;font-weight:500;
    color:#002D72;text-align:left;margin:0 0 6px;
  }
  #diagnosisLeadForm .hs-form-required{color:#0072CE;}
  #diagnosisLeadForm .inputs-list{list-style:none;margin:6px 0 0;padding:0;text-align:left;}
  #diagnosisLeadForm .hs-input,
  #diagnosisLeadForm input[type="text"],
  #diagnosisLeadForm input[type="email"],
  #diagnosisLeadForm input[type="tel"],
  #diagnosisLeadForm input[type="number"],
  #diagnosisLeadForm select,
  #diagnosisLeadForm textarea{
    width:100%;font-family:"Poppins",Arial,sans-serif;font-size:14px;color:#002D72;
    background-color:#FFFFFF;border:1px solid #B8CCEA;border-radius:var(--radius-form);padding:14px 16px;
  }
  #diagnosisLeadForm .hs-input::placeholder,
  #diagnosisLeadForm input::placeholder,
  #diagnosisLeadForm textarea::placeholder{color:#B8CCEA;}
  #diagnosisLeadForm .hs-input:focus,
  #diagnosisLeadForm input:focus,
  #diagnosisLeadForm select:focus,
  #diagnosisLeadForm textarea:focus{
    border-color:#0072CE;outline:2px solid #41B6E6;outline-offset:2px;
  }
  #diagnosisLeadForm .hs-button,
  #diagnosisLeadForm input[type="submit"],
  #diagnosisLeadForm button[type="submit"]{
    width:100%;display:block;font-family:"Poppins",Arial,sans-serif;font-size:15px;font-weight:600;
    color:#FFFFFF;background-color:#0072CE;border:0;border-radius:var(--radius-form);padding:15px 24px;
    box-shadow:none;cursor:pointer;transition:background-color .15s ease;
  }
  #diagnosisLeadForm .hs-button:hover,
  #diagnosisLeadForm input[type="submit"]:hover,
  #diagnosisLeadForm button[type="submit"]:hover{background-color:#002D72;}
  #diagnosisLeadForm .hs-error-msgs{list-style:none;margin:6px 0 0;padding:0;text-align:left;}
  #diagnosisLeadForm .hs-error-msgs label{color:#C0392B;font-size:12.5px;font-weight:500;}
  #diagnosisLeadForm .hs-richtext{font-family:"Poppins",Arial,sans-serif;color:#002D72;text-align:left;}
  @media (max-width:640px){#diagnosisLeadForm{--hsf-field-input__padding:13px 14px;}}

  .result-wrap{padding:28px 0 60px;}
  .result-toolbar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:24px;align-items:center;}
  @media (max-width:640px){.result-toolbar{flex-direction:column-reverse;align-items:stretch;} .result-toolbar .btn{width:100%;padding:14px;}}

  .result-header{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:32px 36px;margin-bottom:24px;}
  .result-title{font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:0 0 14px;}
  .result-h1{font-size:14.5px;color:var(--muted);font-weight:600;margin:0 0 6px;}
  .result-level-name{font-size:32px;font-weight:600;color:var(--navy);margin:0 0 12px;line-height:1.15;}
  .result-level-desc{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 20px;max-width:700px;}
  .result-synth{font-size:14.5px;color:var(--navy);background:#F0F5FC;border-radius:10px;padding:14px 18px;line-height:1.6;margin:0 0 24px;max-width:760px;}
  @media (max-width:640px){.result-header{padding:22px 20px;} .result-level-name{font-size:25px;}}

  .scale{margin-top:16px;}
  .scale-track{position:relative;height:8px;background:#E5EDF7;border-radius:999px;overflow:visible;margin-bottom:14px;}
  .scale-fill{position:absolute;top:0;left:0;height:100%;background:#0072CE;border-radius:999px;}
  .scale-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px var(--blue),0 2px 6px rgba(0,45,114,.25);z-index:2;}
  .scale-labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--muted);text-align:center;gap:4px;}
  .scale-labels span{padding:0 4px;line-height:1.3;}
  .scale-labels span.current{color:var(--navy);font-weight:600;}

  .attention-block{
    width:100%; box-sizing:border-box; margin-top:24px; padding:18px 20px;
    background:#F0F5FC; border-left:4px solid var(--blue); border-radius:10px;
  }
  .attention-title{font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:0 0 8px;}
  .attention-text{font-size:14.5px;color:var(--navy);line-height:1.6;margin:0;}
  @media (max-width:640px){.attention-block{padding:16px 18px;}}
  @media (max-width:640px){.scale-labels{font-size:10px;}}

  .result-section{margin-bottom:28px;}
  .section-h{font-size:20px;font-weight:600;color:var(--navy);margin:0 0 18px;line-height:1.3;}
  @media (max-width:640px){.section-h{font-size:18px;}}

  .radar-card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:32px;border:1px solid #E5EDF7;display:flex;flex-direction:column;align-items:center;}
  .radar-chart-wrap{width:100%;max-width:720px;margin:0 auto;}
  .radar-chart{width:100%;height:auto;display:block;}
  .radar-chart :focus,.radar-point:focus{outline:none;}
  .radar-point.focused,.radar-point:hover{r:8;transition:r .15s ease;}
  .radar-help{font-size:13px;color:#002D72;text-align:center;margin:18px 0 0;max-width:520px;line-height:1.55;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  @media (max-width:640px){.radar-card{padding:20px 16px;}}
  @media (prefers-reduced-motion: reduce){.radar-point{transition:none !important;}}

  .strengths{display:flex;flex-direction:column;gap:12px;}
  .scard{background:linear-gradient(180deg,#F0F8EE 0%,#FFFFFF 100%);border:1px solid #D6E9D2;border-left:4px solid var(--green);border-radius:var(--radius-md);padding:20px 24px;}
  .scard-title{font-size:15px;font-weight:600;color:var(--navy);margin:0 0 8px;}
  .scard-text{font-size:14px;color:var(--muted);line-height:1.6;margin:0;}

  .priorities{display:flex;flex-direction:column;gap:16px;}
  .pcard{background:#fff;border-radius:var(--radius-md);padding:26px;border:1px solid var(--border);box-shadow:var(--shadow-sm);border-left:5px solid var(--blue);}
  .pcard.p1{border-left-color:var(--pink);background:linear-gradient(180deg,#FFF5FB 0%,#FFFFFF 55%);}
  .pcard-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap;}
  .pcard-icon{width:40px;height:40px;border-radius:10px;background:#EEF5FE;display:flex;align-items:center;justify-content:center;color:var(--blue);flex-shrink:0;}
  .pcard.p1 .pcard-icon{background:#FFEAF6;color:var(--pink);}
  .pcard-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .pcard-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);padding:4px 10px;background:#EEF5FE;border-radius:100px;}
  .pcard.p1 .pcard-badge{color:var(--pink);background:#FFEAF6;}
  .pcard-pilar{font-size:13px;color:var(--muted);font-weight:500;}
  .pcard-title{font-size:20px;font-weight:600;color:var(--navy);margin:8px 0 6px;line-height:1.3;}
  .pcard-blocks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px;}
  @media (max-width:820px){.pcard-blocks{grid-template-columns:1fr;}}
  .pblock{background:var(--bg);border-radius:10px;padding:14px 16px;}
  .pblock-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--blue);margin:0 0 6px;}
  .pcard.p1 .pblock-label{color:var(--pink);}
  .pblock-text{font-size:13.5px;color:var(--text);line-height:1.55;margin:0;}
  .pcard-blocked{margin-top:16px;padding:12px 14px;background:#FFF7E6;border-left:3px solid #F0A500;border-radius:8px;font-size:13px;color:#7A4E00;line-height:1.5;}
  @media (max-width:640px){.pcard{padding:22px 20px;} .pcard-title{font-size:18px;}}

  .plan{background:#fff;border-radius:var(--radius-md);padding:28px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media (max-width:820px){.plan-grid{grid-template-columns:1fr;gap:14px;}}
  .plan-col{background:var(--bg);border-radius:12px;padding:20px 22px;}
  .plan-col-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px;font-weight:600;color:var(--navy);}
  .plan-dot{width:12px;height:12px;border-radius:50%;background:var(--blue);flex-shrink:0;}
  .plan-col:nth-child(1) .plan-dot{background:var(--pink);}
  .plan-col:nth-child(2) .plan-dot{background:var(--blue);}
  .plan-col:nth-child(3) .plan-dot{background:var(--navy);}
  .plan-item{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5;color:var(--text);cursor:pointer;}
  .plan-item input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--blue);cursor:pointer;flex-shrink:0;}
  .plan-item.checked > span{color:var(--muted);text-decoration:line-through;}
  @media (max-width:640px){.plan{padding:20px;} .plan-col{padding:18px 20px;}}

  .course-card{background:#fff;border-radius:var(--radius-md);padding:28px 32px;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;}
  .course-info{flex:1;min-width:240px;}
  .course-selo{font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:0 0 8px;}
  .course-name{font-size:17px;font-weight:600;color:var(--navy);margin:0 0 8px;}
  .course-desc{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0;}
  @media (max-width:640px){.course-card{padding:22px 20px;} .course-card .btn{width:100%;}}

  .tech-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch;}
  .tech-card2{background:#fff;border-radius:var(--radius-md);padding:24px 26px;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;}
  .tech-card2-title{font-size:15.5px;font-weight:600;color:var(--navy);margin:0 0 10px;line-height:1.35;}
  .tech-card2-text{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0;}
  @media (max-width:1024px){.tech-cards-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){.tech-cards-grid{grid-template-columns:1fr;} .tech-card2{padding:20px 22px;}}

  .nibo-cta{background:linear-gradient(135deg,var(--navy) 0%,#003C93 100%);border-radius:var(--radius-lg);padding:44px 40px;color:#fff;text-align:center;margin-top:8px;}
  .nibo-cta-tag{font-size:11px;color:var(--sky);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin:0 0 10px;}
  .nibo-cta-title{font-size:26px;font-weight:600;color:#fff;margin:0 0 12px;line-height:1.25;}
  .nibo-cta-body{font-size:15px;color:var(--ice);line-height:1.6;margin:0 auto 24px;max-width:560px;}
  .nibo-cta a{display:inline-block;background:#fff;color:var(--navy);border:none;padding:14px 28px;font-size:15px;font-weight:600;border-radius:12px;font-family:"Poppins",Arial,sans-serif;cursor:pointer;transition:all .18s ease;text-decoration:none;}
  .nibo-cta a:hover{background:var(--ice);}
  .nibo-cta a:focus-visible{outline:3px solid var(--sky);outline-offset:3px;}
  @media (max-width:640px){.nibo-cta{padding:32px 24px;} .nibo-cta-title{font-size:22px;} .nibo-cta a{width:100%;}}



  .evaluation{background:#fff;border-radius:var(--radius-md);padding:26px 30px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .eval-title{font-size:16px;font-weight:600;color:var(--navy);margin:0 0 16px;}
  .eval-opts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .eval-opt{padding:10px 18px;border-radius:100px;border:1.5px solid var(--border);background:#fff;font-family:"Poppins",Arial,sans-serif;font-size:13.5px;color:var(--navy);cursor:pointer;transition:all .15s ease;}
  .eval-opt:hover{border-color:var(--sky);}
  .eval-opt.selected{border-color:var(--blue);background:#EEF5FE;}
  .eval-followup{margin-top:14px;}
  .eval-followup label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .eval-followup textarea{width:100%;min-height:80px;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:"Poppins",Arial,sans-serif;font-size:13.5px;resize:vertical;}
  .eval-followup textarea:focus-visible{outline:3px solid var(--sky);}
  .eval-confirm{font-size:13.5px;color:var(--green);font-weight:600;margin-top:14px;}

  .hidden{display:none !important;}

  /* Resume/completed modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,45,114,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal-card{background:#fff;border-radius:var(--radius-lg);padding:32px;max-width:440px;width:100%;box-shadow:var(--shadow-md);}
  .modal-title{font-size:19px;font-weight:600;color:var(--navy);margin:0 0 12px;}
  .modal-body{font-size:14.5px;color:var(--muted);line-height:1.6;margin:0 0 24px;}
  .modal-actions{display:flex;flex-direction:column;gap:10px;}
  @media (max-width:640px){.modal-card{padding:24px;}}

  .debug-panel{max-width:1080px;margin:24px auto 0;background:#0B1220;color:#B8CCEA;border-radius:12px;padding:20px 24px;font-family:monospace;font-size:12px;white-space:pre-wrap;line-height:1.6;}
  .debug-panel h3{color:#fff;font-family:"Poppins",Arial,sans-serif;font-size:14px;margin:0 0 10px;}

  @media print{
    body{background:#fff;}
    header,.result-toolbar,.plan-item input,.evaluation,.debug-panel{display:none !important;}
    .page{padding:0;}
    .result-header,.radar-card,.pcard,.plan,.scard,.nibo-cta,.course-card,.tech-card2{
      box-shadow:none !important;page-break-inside:avoid;break-inside:avoid;
    }
    .section-h,.pcard-title,.plan-col-title{page-break-after:avoid;break-after:avoid;}
    .plan-grid,.pcard-blocks,.tech-cards-grid{grid-template-columns:1fr !important;}
  }

</style>
</head>

S>=2 E ANA<=1","principal":"ANA","relacionados":["CUS"],"bonus":{"ANA":6.0},"causaId":"CUSTOS_ANALISE","elegivelSintese":true},{"id":"RC15","precedencia":10.0,"condicao":"CUS<=1 E PRE<=1","principal":"CUS","relacionados":["PRE"],"bonus":{"CUS":7.0},"causaId":"CUSTOS_PRECO","elegivelSintese":true},{"id":"RC16","precedencia":18.0,"condicao":"CUS>=2 E PRE<=1","principal":"PRE","relacionados":["CUS"],"bonus":{"PRE":6.0},"causaId":"CUSTOS_PRECO","elegivelSintese":true},{"id":"RC17","precedencia":12.0,"condicao":"ANA<=1 E PLA>=2","principal":"ANA","relacionados":["PLA"],"bonus":{"ANA":7.0},"causaId":"PLANEJAMENTO","elegivelSintese":true},{"id":"RC18","precedencia":18.0,"condicao":"ANA>=2 E PLA<=1","principal":"PLA","relacionados":["ANA"],"bonus":{"PLA":6.0},"causaId":"PLANEJAMENTO","elegivelSintese":true},{"id":"RC19","precedencia":22.0,"condicao":"DAD>=2 E BAN>=2 E CAI<=1","principal":"CAI","relacionados":["DAD","BAN"],"bonus":{"CAI":6.0},"causaId":"CAIXA","elegivelSintese":true},{"id":"RC20","precedencia":22.0,"condicao":"DAD>=2 E BAN>=2 E CUS>=2 E ANA<=1","principal":"ANA","relacionados":["DAD","BAN","CUS"],"bonus":{"ANA":4.0},"causaId":"CUSTOS_ANALISE","elegivelSintese":true},{"id":"RC21","precedencia":22.0,"condicao":"ANA>=2 E CAI>=2 E PLA<=1","principal":"PLA","relacionados":["ANA","CAI"],"bonus":{"PLA":4.0},"causaId":"PLANEJAMENTO","elegivelSintese":true},{"id":"RC24","precedencia":30.0,"condicao":"7 ou mais pilares com score<=1","principal":"DAD","relacionados":["BAN","CAI"],"bonus":{"DAD":3.0,"BAN":2.0,"CAI":2.0},"causaId":"PERFIL","elegivelSintese":false},{"id":"RC25","precedencia":30.0,"condicao":"9 ou mais pilares com score>=2","principal":"ANA","relacionados":["PLA","PRE"],"bonus":{},"causaId":"PERFIL","elegivelSintese":false}],"FEEDBACKS_COMB":{"RC01":{"id":"FB_RC01","titulo":"Organize os registros e confira os saldos","textoPrincipal":"Os registros e a conferência bancária ainda não formam uma base confiável para acompanhar o saldo.","porqueImporta":"Sem registros completos e conferência frequente, os saldos podem não representar o que realmente aconteceu na empresa.","pilarPrincipal":"DAD","causaId":"BASE_DADOS","attentionText":"Registre todas as entradas e saídas e crie uma rotina para comparar essas informações com o extrato bancário, corrigindo as diferenças encontradas.","usarSintese":true},"RC02":{"id":"FB_RC02","titulo":"Complete o registro das movimentações","textoPrincipal":"A conferência bancária já existe, mas ainda há movimentações que ficam fora do controle ou são registradas com atraso.","porqueImporta":"A conferência bancária não consegue identificar corretamente a origem das diferenças quando parte das entradas e saídas não foi registrada.","pilarPrincipal":"DAD","causaId":"BASE_DADOS","attentionText":"Registre as movimentações que ainda ficam fora do controle financeiro e depois refaça a comparação com o extrato bancário.","usarSintese":true},"RC03":{"id":"FB_RC03","titulo":"Confira os registros com o banco","textoPrincipal":"As movimentações são registradas, mas a comparação com o extrato ainda não acontece com frequência.","porqueImporta":"Mesmo com as movimentações registradas, erros, duplicidades ou valores esquecidos podem permanecer sem uma comparação frequente com o extrato.","pilarPrincipal":"BAN","causaId":"BASE_DADOS","attentionText":"Compare os registros financeiros com o extrato bancário com frequência e corrija todas as diferenças encontradas.","usarSintese":true},"RC04":{"id":"FB_RC04","titulo":"Separe as movimentações pessoais das empresariais","textoPrincipal":"Pagamentos pessoais feitos pela empresa dificultam separar os gastos do negócio e manter os registros completos.","porqueImporta":"Pagamentos pessoais feitos pela conta da empresa dificultam entender os gastos reais e o dinheiro disponível para o negócio.","pilarPrincipal":"DAD","causaId":"BASE_DADOS","attentionText":"Identifique as movimentações pessoais, registre as retiradas corretamente e deixe de pagar despesas particulares com a conta da empresa.","usarSintese":true},"RC05":{"id":"FB_RC05","titulo":"Organize as retiradas da empresa","textoPrincipal":"Retiradas sem valor ou frequência definidos alteram o saldo de forma inesperada e prejudicam a previsão.","porqueImporta":"Retiradas sem valor ou frequência definidos alteram o saldo inesperadamente e tornam a previsão de caixa menos confiável.","pilarPrincipal":"SEP","causaId":"SEPARACAO","attentionText":"Defina um valor e uma frequência para as retiradas e registre cada movimentação no controle financeiro.","usarSintese":true},"RC06":{"id":"FB_RC06","titulo":"Organize os compromissos dos próximos 30 dias","textoPrincipal":"Pagamentos e recebimentos futuros ainda não estão reunidos em uma visão do caixa dos próximos 30 dias.","porqueImporta":"Sem registrar o que deve entrar e sair, a previsão considera apenas o saldo atual e não mostra possíveis faltas ou sobras de dinheiro.","pilarPrincipal":"CAI","causaId":"CAIXA","attentionText":"Liste os pagamentos e recebimentos previstos para os próximos 30 dias e atualize essa visão sempre que um valor ou uma data mudar.","usarSintese":true},"RC07":{"id":"FB_RC07","titulo":"Registre os próximos pagamentos","textoPrincipal":"Os recebimentos são acompanhados, mas as contas a pagar ainda são tratadas de forma reativa.","porqueImporta":"Contas não registradas antecipadamente podem comprometer o saldo disponível e gerar atrasos ou decisões tomadas sem considerar obrigações futuras.","pilarPrincipal":"CAI","causaId":"CAIXA","attentionText":"Registre todas as contas a pagar, incluindo vencimentos e pagamentos recorrentes, antes de projetar o caixa.","usarSintese":true},"RC08":{"id":"FB_RC08","titulo":"Acompanhe os próximos recebimentos","textoPrincipal":"Os pagamentos são acompanhados, mas valores a receber e atrasos ainda não entram em uma rotina organizada.","porqueImporta":"Valores esperados que não são acompanhados podem atrasar sem serem percebidos e criar uma expectativa de caixa que não se confirma.","pilarPrincipal":"CAI","causaId":"CAIXA","attentionText":"Registre os valores a receber, acompanhe as datas previstas e estabeleça uma rotina para identificar e cobrar atrasos.","usarSintese":true},"RC09":{"id":"FB_RC09","titulo":"Transforme seus controles em uma previsão de caixa","textoPrincipal":"Pagamentos e recebimentos já estão organizados, mas ainda não são usados para projetar o saldo futuro.","porqueImporta":"Os dados de pagamentos e recebimentos já existem, mas ainda não estão sendo usados para antecipar o saldo dos próximos dias.","pilarPrincipal":"CAI","causaId":"CAIXA","attentionText":"Reúna os pagamentos e recebimentos já registrados em uma visão dos próximos 30 dias e revise essa projeção semanalmente.","usarSintese":true},"RC10":{"id":"FB_RC10","titulo":"Comece a previsão por um saldo confiável","textoPrincipal":"A empresa já estima o caixa, mas o saldo inicial e as movimentações ainda precisam ser validados com o banco.","porqueImporta":"Uma projeção construída sobre um saldo incorreto pode indicar uma sobra ou uma falta de dinheiro que não existe.","pilarPrincipal":"BAN","causaId":"CAIXA","attentionText":"Confira o saldo inicial com o extrato bancário, corrija as diferenças e só então atualize a previsão de caixa.","usarSintese":true},"RC11":{"id":"FB_RC11","titulo":"Conecte os pagamentos à conferência bancária","textoPrincipal":"Contas a pagar e saídas bancárias ainda são acompanhadas em rotinas separadas.","porqueImporta":"Sem relacionar os pagamentos registrados às saídas do banco, contas podem ficar marcadas incorretamente como abertas ou pagas.","pilarPrincipal":"PAG","causaId":"OPERACAO_PAG","attentionText":"Compare as contas registradas com as saídas bancárias e atualize a situação de cada pagamento.","usarSintese":true},"RC12":{"id":"FB_RC12","titulo":"Conecte os recebimentos à conferência bancária","textoPrincipal":"Valores a receber e entradas bancárias ainda não são conciliados em uma mesma rotina.","porqueImporta":"Sem relacionar os recebimentos previstos às entradas do banco, atrasos e valores recebidos podem não ser identificados corretamente.","pilarPrincipal":"REC","causaId":"OPERACAO_REC","attentionText":"Compare os valores a receber com as entradas bancárias e atualize o que foi recebido, está atrasado ou ainda está pendente.","usarSintese":true},"RC13":{"id":"FB_RC13","titulo":"Organize os gastos antes de analisar os resultados","textoPrincipal":"Os gastos ainda não estão organizados em categorias suficientes para sustentar uma análise confiável.","porqueImporta":"Sem separar os gastos por tipo, fica difícil saber onde o dinheiro foi utilizado e quais despesas mais afetam o resultado.","pilarPrincipal":"CUS","causaId":"CUSTOS_ANALISE","attentionText":"Crie categorias para os principais gastos e classifique as movimentações do mês antes de revisar os resultados.","usarSintese":true},"RC14":{"id":"FB_RC14","titulo":"Use os gastos para analisar o resultado mensal","textoPrincipal":"Os gastos já estão organizados, mas ainda não são revisados em uma análise mensal dos resultados.","porqueImporta":"As despesas já estão organizadas, mas esse trabalho perde valor quando não é usado para entender o desempenho da empresa.","pilarPrincipal":"ANA","causaId":"CUSTOS_ANALISE","attentionText":"Ao fim de cada mês, revise receitas, gastos e valores atrasados e compare o resultado com o período anterior.","usarSintese":true},"RC15":{"id":"FB_RC15","titulo":"Identifique os custos de cada serviço","textoPrincipal":"Os preços ainda são definidos sem uma visão completa dos custos envolvidos em cada serviço.","porqueImporta":"Sem conhecer os custos envolvidos na entrega, o preço pode não cobrir as despesas nem gerar o retorno esperado.","pilarPrincipal":"CUS","causaId":"CUSTOS_PRECO","attentionText":"Liste os custos diretos e indiretos de cada serviço antes de revisar os preços praticados.","usarSintese":true},"RC16":{"id":"FB_RC16","titulo":"Use seus custos para revisar os preços","textoPrincipal":"Os custos já estão organizados, mas ainda não são usados de forma consistente na revisão dos preços.","porqueImporta":"Mesmo com os gastos organizados, preços definidos apenas pela concorrência ou por percepção podem reduzir a margem dos serviços.","pilarPrincipal":"PRE","causaId":"CUSTOS_PRECO","attentionText":"Calcule quanto custa entregar cada serviço e compare esse valor com o preço cobrado e o retorno desejado.","usarSintese":true},"RC17":{"id":"FB_RC17","titulo":"Compare o planejado com o realizado","textoPrincipal":"A empresa define metas, mas ainda não compara com regularidade o planejado e o realizado.","porqueImporta":"Metas e limites de gastos deixam de orientar a gestão quando não são comparados com o que realmente aconteceu.","pilarPrincipal":"ANA","causaId":"PLANEJAMENTO","attentionText":"Faça uma revisão mensal do planejado e do realizado e ajuste as metas quando receitas ou gastos se distanciarem do esperado.","usarSintese":true},"RC18":{"id":"FB_RC18","titulo":"Transforme o histórico em metas financeiras","textoPrincipal":"Os resultados são analisados, mas ainda não foram transformados em metas e projeções para os próximos meses.","porqueImporta":"Sem metas para os próximos meses, os dados anteriores ajudam a entender o passado, mas pouco orientam as decisões futuras.","pilarPrincipal":"PLA","causaId":"PLANEJAMENTO","attentionText":"Use os resultados dos últimos meses para definir metas de receita e limites de gastos e acompanhe sua evolução mensalmente.","usarSintese":true},"RC19":{"id":"FB_RC19","titulo":"Construa uma visão do caixa futuro","textoPrincipal":"A base financeira já é confiável e está pronta para ser usada em uma previsão de caixa.","porqueImporta":"Registros e saldos confiáveis permitem antecipar períodos de maior pressão financeira, mas essa oportunidade ainda não está sendo aproveitada.","pilarPrincipal":"CAI","causaId":"CAIXA","attentionText":"Projete as entradas, saídas e o saldo dos próximos 30 dias e atualize a previsão toda semana.","usarSintese":true},"RC20":{"id":"FB_RC20","titulo":"Transforme os controles em análise mensal","textoPrincipal":"Registros, conferência e categorias já permitem uma análise mensal mais estruturada.","porqueImporta":"Informações organizadas ajudam a controlar a rotina, mas precisam ser analisadas para revelar mudanças nos gastos e nos resultados.","pilarPrincipal":"ANA","causaId":"CUSTOS_ANALISE","attentionText":"Crie uma revisão mensal de receitas, gastos, atrasos e resultado e compare os dados com o mês anterior.","usarSintese":true},"RC21":{"id":"FB_RC21","titulo":"Use os dados para planejar os próximos meses","textoPrincipal":"A empresa já acompanha resultados e caixa futuro e pode estruturar metas e cenários.","porqueImporta":"A empresa já possui análises e previsões, mas ainda pode usar essas informações de forma mais estruturada para definir prioridades.","pilarPrincipal":"PLA","causaId":"PLANEJAMENTO","attentionText":"Defina metas de receita, limites de gastos e uma rotina mensal para comparar o planejado com o realizado.","usarSintese":true},"RC24":{"id":"FB_RC24","titulo":"Comece pelos controles essenciais","textoPrincipal":"Várias práticas essenciais ainda estão frágeis e precisam ser organizadas em uma sequência simples.","porqueImporta":"Tentar corrigir muitas áreas ao mesmo tempo pode dificultar a criação de uma rotina que realmente seja mantida.","pilarPrincipal":"DAD","causaId":"PERFIL","attentionText":"Comece registrando as movimentações, organizando pagamentos e recebimentos e conferindo os valores com o banco.","usarSintese":false},"RC25":{"id":"FB_RC25","titulo":"Concentre-se nas poucas lacunas restantes","textoPrincipal":"A gestão já possui uma base sólida e o maior ganho está em corrigir poucas lacunas específicas.","porqueImporta":"A gestão já possui uma base sólida, e adicionar novos controles sem necessidade pode aumentar o trabalho sem gerar um ganho relevante.","pilarPrincipal":"ANA","causaId":"PERFIL","attentionText":"Escolha uma ou duas áreas com menor maturidade, defina uma melhoria objetiva e acompanhe seu efeito antes de criar novos processos.","usarSintese":false}},"FEEDBACKS_BASICOS":{"DAD|0":{"titulo":"Comece por registrar todas as movimentações","motivo":"Parte do dinheiro que entra e sai ainda não é registrada.","porque":"Sem uma base completa, saldos, caixa e análises podem ficar incorretos.","hoje":"Liste as movimentações dos últimos sete dias que ainda não foram registradas.","d7":"Escolha um único controle e inclua as movimentações pendentes.","d30":"Crie uma rotina diária ou semanal para manter a base atualizada.","resultado":"Uma base financeira mais completa e confiável."},"DAD|1":{"titulo":"Centralize os registros financeiros","motivo":"As informações estão divididas entre anotações, planilhas e consultas ao banco.","porque":"Controles dispersos aumentam o retrabalho e o risco de esquecer movimentações.","hoje":"Escolha onde todas as movimentações serão registradas.","d7":"Transfira para esse controle as informações que estão espalhadas.","d30":"Revise semanalmente se algo ainda ficou fora da base.","resultado":"Menos informação dispersa e mais clareza sobre os saldos."},"DAD|2":{"titulo":"Complete e padronize sua base","motivo":"Você já usa uma ferramenta, mas parte das informações continua em outros lugares.","porque":"A análise só fica confiável quando a base principal reúne tudo o que movimenta o caixa.","hoje":"Identifique quais informações ainda ficam fora da ferramenta.","d7":"Migre ou padronize o registro dessas movimentações.","d30":"Faça uma revisão periódica para garantir que a base permaneça completa.","resultado":"Registros centralizados e prontos para apoiar decisões."},"SEP|0":{"titulo":"Separe o dinheiro pessoal do empresarial","motivo":"Alguns pagamentos pessoais ainda são feitos com dinheiro da empresa.","porque":"Essa mistura dificulta saber quanto o negócio realmente gera e quanto pode gastar.","hoje":"Liste os pagamentos pessoais feitos com recursos da empresa no último mês.","d7":"Separe as contas e identifique cada retirada pessoal.","d30":"Defina uma regra simples para as retiradas futuras.","resultado":"Mais clareza sobre o dinheiro disponível para a operação."},"SEP|1":{"titulo":"Organize e registre as retiradas","motivo":"Você tenta separar as finanças, mas ainda existem retiradas sem registro ou sem valor definido.","porque":"Saídas imprevisíveis distorcem o caixa e dificultam o planejamento.","hoje":"Levante as retiradas realizadas no último mês.","d7":"Defina como e quando cada retirada será registrada.","d30":"Estabeleça um valor ou uma frequência para as retiradas.","resultado":"Menos surpresas e maior previsibilidade do caixa."},"SEP|2":{"titulo":"Defina uma rotina para as retiradas","motivo":"As contas já estão separadas e as retiradas são registradas, mas ainda podem ganhar regularidade.","porque":"Uma rotina definida facilita a previsão e evita decisões pessoais que pressionem o caixa.","hoje":"Revise o valor e a frequência das retiradas atuais.","d7":"Defina uma regra que caiba na realidade da empresa.","d30":"Inclua as retiradas previstas no planejamento mensal.","resultado":"Retiradas mais previsíveis e alinhadas ao caixa."},"PAG|0":{"titulo":"Antecipe as contas antes do vencimento","motivo":"Os pagamentos são tratados conforme as cobranças aparecem.","porque":"A falta de visão futura aumenta o risco de atrasos, juros e falta de dinheiro.","hoje":"Liste todas as contas que vencem nos próximos 30 dias.","d7":"Registre valores e datas de vencimento em um único controle.","d30":"Inclua despesas recorrentes e revise a lista toda semana.","resultado":"Mais previsibilidade sobre as saídas de dinheiro."},"PAG|1":{"titulo":"Troque lembretes dispersos por um controle único","motivo":"As contas são acompanhadas em lembretes, planilhas ou no aplicativo do banco.","porque":"Informações espalhadas dificultam priorizar pagamentos e prever o caixa.","hoje":"Reúna as contas em uma única lista.","d7":"Registre valores, vencimentos e situação de cada conta.","d30":"Crie uma revisão semanal dos próximos vencimentos.","resultado":"Contas acompanhadas com menos risco de atraso."},"PAG|2":{"titulo":"Inclua pagamentos recorrentes","motivo":"Você registra valores e vencimentos, mas os pagamentos que se repetem ainda podem depender de lembrança.","porque":"Despesas recorrentes são essenciais para uma previsão realista do caixa.","hoje":"Liste os pagamentos que se repetem todos os meses.","d7":"Inclua essas despesas no controle com antecedência.","d30":"Revise mensalmente valores e datas das recorrências.","resultado":"Uma visão mais completa dos compromissos futuros."},"REC|0":{"titulo":"Crie uma rotina para acompanhar o que falta receber","motivo":"Não existe uma rotina definida para os valores a receber.","porque":"Sem acompanhamento, atrasos podem ser percebidos tarde e o caixa fica imprevisível.","hoje":"Liste os valores que sua empresa ainda tem a receber.","d7":"Registre cliente, valor e data esperada de cada recebimento.","d30":"Revise a lista semanalmente e identifique atrasos.","resultado":"Mais clareza sobre as entradas futuras."},"REC|1":{"titulo":"Acompanhe os recebimentos antes do atraso","motivo":"Os valores são verificados principalmente quando o atraso já foi percebido.","porque":"Acompanhar antes do vencimento ajuda a antecipar problemas e melhorar a cobrança.","hoje":"Reúna os recebimentos esperados dos próximos 30 dias.","d7":"Registre as datas e marque o que foi recebido.","d30":"Crie uma rotina de acompanhamento antes e depois do vencimento.","resultado":"Menos atrasos descobertos tarde."},"REC|2":{"titulo":"Estruture uma rotina de cobrança","motivo":"Você registra os valores e acompanha as datas de recebimento.","porque":"O próximo ganho é agir de forma consistente quando um pagamento atrasa.","hoje":"Identifique os recebimentos que já estão vencidos.","d7":"Defina quando e como os clientes serão lembrados.","d30":"Acompanhe atrasos e resultados da cobrança todo mês."," astos já são organizados por categorias.","porque":"O próximo passo é usar essa base para encontrar concentrações, desvios e oportunidades.","hoje":"Identifique as três categorias com maior valor no último mês.","d7":"Compare essas categorias com o mês anterior.","d30":"Passe a analisar também por área, projeto, cliente ou serviço quando fizer sentido.","resultado":"Mais clareza sobre os fatores que pressionam os gastos."},"ANA|0":{"titulo":"Crie uma análise mensal simples","motivo":"A empresa ainda não avalia os resultados ao fim de cada mês.","porque":"Sem uma revisão periódica, problemas e oportunidades podem passar despercebidos.","hoje":"Escolha uma data para revisar o último mês.","d7":"Reúna receitas, gastos e valores em atraso.","d30":"Registre os principais desvios e as decisões tomadas.","resultado":"Uma rotina mensal de análise e correção."},"ANA|1":{"titulo":"Vá além do saldo da conta","motivo":"A análise se concentra principalmente no saldo e nas contas em aberto.","porque":"O saldo mostra a posição do momento, mas não explica o resultado da operação.","hoje":"Reúna o que entrou, saiu e ficou em atraso no último mês.","d7":"Separe receitas, gastos e principais variações.","d30":"Compare os resultados de dois ou três meses.","resultado":"Visão mais completa do desempenho financeiro."},"ANA|2":{"titulo":"Transforme a revisão do mês em decisões","motivo":"Você já revisa entradas, saídas e atrasos.","porque":"Relacionar essas informações e comparar períodos ajuda a decidir o que deve mudar.","hoje":"Escolha dois indicadores simples para acompanhar.","d7":"Compare o mês atual com o anterior e identifique os maiores desvios.","d30":"Registre uma ação para cada desvio relevante e acompanhe o resultado.","resultado":"Análises conectadas a decisões práticas."},"PLA|0":{"titulo":"Comece a planejar os próximos meses","motivo":"A empresa ainda não planeja receitas e gastos futuros.","porque":"Sem metas e limites, decisões de curto prazo podem afastar a empresa dos  e as premissas são corrigidas.","passo":"Revise as metas atualmente registradas.","resultado":"Planejamento conectado à realidade da empresa.","atencao":"N/A","status":"PASS"},{"tipo":"Fallback","id":"PRE|0","titulo":"Revise como os preços são definidos","porque":"Sem considerar custos e resultado desejado, um serviço pode vender bem e ainda gerar pouco retorno.","passo":"Escolha um serviço importante e liste seus principais custos.","resultado":"Preços mais conscientes e sustentáveis.","atencao":"N/A","status":"PASS"},{"tipo":"Fallback","id":"PRE|1","titulo":"Complete o cálculo dos custos dos serviços","porque":"Custos esquecidos podem reduzir a margem sem que isso fique evidente.","passo":"Revise os custos diretos e indiretos de um serviço.","resultado":"Maior clareza sobre o retorno de cada serviço.","atencao":"N/A","status":"PASS"},{"tipo":"Fallback","id":"PRE|2","titulo":"Crie uma rotina de revisão de preços","porque":"Revisões periódicas evitam que mudanças de custo e mercado reduzam a rentabilidade.","passo":"Escolha os serviços que mais impactam a receita.","resultado":"Preços atualizados com base na realidade da operação.","atencao":"N/A","status":"PASS"}]</script>
<script>
/* ============================================================
   DADOS DA MATRIZ V12 (fonte de verdade — não alterar por interpretação própria)
   ============================================================ */
const MATRIX = JSON.parse(document.getElementById('matrix-data').textContent);
const SCENARIOS = JSON.parse(document.getElementById('scenarios-data').textContent);
const EDITORIAL_TESTS = JSON.parse(document.getElementById('editorial-tests-data').textContent);

const QUESTIONS = MATRIX.QUESTIONS;      // 10 perguntas de maturidade (NC01–NC10) — sem pergunta de objetivo
const PESOS = MATRIX.PESOS;
const ESTAGIOS = MATRIX.ESTAGIOS;
const FORTES = MATRIX.FORTES;
const REGRAS = MATRIX.REGRAS;            // 23 regras combinadas ativas (RC22/RC23 removidas na V12)
const FEEDBACKS_COMB = MATRIX.FEEDBACKS_COMB;
const FEEDBACKS_BASICOS = MATRIX.FEEDBACKS_BASICOS;
const CHECKLISTS_COMB = MATRIX.CHECKLISTS_COMB;
const TECH_CARDS = MATRIX.TECH_CARDS;             // 3 cards por estágio (Tecnologia_por_Estagio_NC)
const COURSE_CONTENT = MATRIX.COURSE_CONTENT;     // Conteudo_Recomendado_NC (único, sem variação por estágio)
const NIBO_CTA_CONTENT = MATRIX.NIBO_CTA_CONTENT; // CTA_Nibo_NC
const RADAR_LABELS = MATRIX.RADAR_LABELS;         // Rótulos do gráfico aranha (Grafico_Aranha_NC)

const PILAR_ORDER = ['DAD','SEP','PAG','REC','BAN','CAI','CUS','ANA','PLA','PRE'];
const NIVEIS_UNI = ['Inicial','Em estruturação','Estruturada','Gerenciada'];

const METHODOLOGY_VERSION = "1.3";
const DATA_SCHEMA_VERSION = "3";
const STORAGE_KEY = "nibo_diagnostico_gf_progress_v3";
const LEGACY_STORAGE_KEYS = ["nibo_diagnostico_gf_progress_v1", "nibo_diagnostico_gf_progress_v2"];
const PROGRESS_MAX_AGE_DAYS = 30;
const CURSO_URL = COURSE_CONTENT.url;
const NIBO_CTA_URL = NIBO_CTA_CONTENT.url;

const DEBUG = /[?&]debug=1\b/.test(window.location.search);

/* ============================================================
   EVENTOS / MEDIÇÃO
   ============================================================ */
function trackEvent(eventName, payload) {
  const safePayload = payload || {};
  try { console.log('[trackEvent]', eventName, safePayload); } catch (e) {}
  try {
    if (window.dataLayer && typeof window.dataLayer.push === 'function') {
      window.dataLayer.push(Object.assign({ event: eventName }, safePayload));
    }
  } catch (e) {}
}

/* ============================================================
   MOTOR DETERMINÍSTICO (validado contra os 20 cenários da matriz)
   ============================================================ */
function evalCondition(cond, scores) {
  if (cond.indexOf('ou mais pilares') !== -1) {
    const m = cond.match(/(\d+) ou mais pilares com score(<=|>=)(\d+)/);
    const n = parseInt(m[1], 10), op = m[2], thresh = parseInt(m[3], 10);
    const count = PILAR_ORDER.filter(p => op === '<=' ? scores[p] <= thresh : scores[p] >= thresh).length;
    return count >= n;
  }
  const parts = cond.split(' E ').map(s => s.trim());
  for (let i = 0; i < parts.length; i++) {
    const part = parts[i];
    const m = part.match(/^([A-Z]+)(<=|>=)(\d+)$/);
    if (!m) return false;
    const pilar = m[1], op = m[2], v = parseInt(m[3], 10);
    const score = scores[pilar];
    if (op === '<=' && !(score <= v)) return false;
    if (op === '>=' && !(score >= v)) return false;
  }
  return true;
}

function computeResult(scores) {
  const notaPilar = {};
  let notaGeral = 0;
  PILAR_ORDER.forEach(p => {
    notaPilar[p] = scores[p] / 3 * 100;
    notaGeral += notaPilar[p] * (PESOS[p].peso / 100);
  });

  const estagio = ESTAGIOS.find(e => notaGeral >= e.min && notaGeral <= e.max) || ESTAGIOS[ESTAGIOS.length - 1];

  const active = REGRAS.filter(r => evalCondition(r.condicao, scores));

  const bonusCombinado = {};
  PILAR_ORDER.forEach(p => bonusCombinado[p] = 0);
  active.forEach(r => {
    Object.keys(r.bonus).forEach(p => { bonusCombinado[p] = (bonusCombinado[p] || 0) + r.bonus[p]; });
  });
  PILAR_ORDER.forEach(p => { if (bonusCombinado[p] > 15) bonusCombinado[p] = 15; });

  // score_prioridade = prioridade_base + bonus_combinado (sem qualquer bônus de objetivo — removido na V12)
  const scorePrioridade = {};
  PILAR_ORDER.forEach(p => {
    const base = (3 - scores[p]) * 10 + PESOS[p].crit;
    scorePrioridade[p] = base + bonusCombinado[p];
  });

  const blockedForP1 = {
    ANA: scores.DAD <= 1 || scores.BAN <= 1 || scores.CUS <= 1,
    PLA: scores.DAD <= 1 || scores.BAN <= 1 || scores.CAI <= 1 || scores.ANA <= 1,
    PRE: scores.CUS <= 1
  };

  const eligible = PILAR_ORDER.filter(p => scores[p] !== 3);

  const scoreTrue = {};
  PILAR_ORDER.forEach(p => { scoreTrue[p] = scorePrioridade[p] - (blockedForP1[p] ? 6 : 0); });

  // Desempate determinístico: 1) maior peso geral do pilar; 2) menor score de maturidade; 3) ordem fixa dos pilares.
  function comparePilares(a, b, scoreMap) {
    if (scoreMap[a] !== scoreMap[b]) return scoreMap[b] - scoreMap[a]; // maior score_prioridade vence
    if (PESOS[a].peso !== PESOS[b].peso) return PESOS[b].peso - PESOS[a].peso; // maior peso vence
    if (scores[a] !== scores[b]) return scores[a] - scores[b]; // menor score de maturidade vence
    return PILAR_ORDER.indexOf(a) - PILAR_ORDER.indexOf(b); // ordem fixa
  }
  function pickBest(pool, scoreMap) {
    if (pool.length === 0) return null;
    return pool.slice().sort((a, b) => comparePilares(a, b, scoreMap))[0];
  }
  const p1 = pickBest(eligible.filter(p => !blockedForP1[p]), scorePrioridade);
  const p2 = pickBest(eligible.filter(p => p !== p1), scoreTrue);
  const p3 = pickBest(eligible.filter(p => p !== p1 && p !== p2), scoreTrue);
  const top3 = [p1, p2, p3].filter(Boolean);

  const eligibleFeedback = active
    .filter(r => FEEDBACKS_COMB[r.id] && FEEDBACKS_COMB[r.id].usarSintese)
    .filter(r => top3.indexOf(r.principal) !== -1 || r.relacionados.some(x => top3.indexOf(x) !== -1))
    .sort((a, b) => a.precedencia - b.precedencia || (a.id < b.id ? -1 : 1));
  const fb1 = eligibleFeedback[0] || null;
  let fb2 = null;
  for (let i = 1; i < eligibleFeedback.length; i++) {
    const cand = eligibleFeedback[i];
    if (!fb1 || cand.causaId !== fb1.causaId) { fb2 = cand; break; }
  }

  const strongCandidates = PILAR_ORDER.filter(p => scores[p] >= 2);
  strongCandidates.sort((a, b) => {
    if (scores[b] !== scores[a]) return scores[b] - scores[a];
    if (PESOS[b].peso !== PESOS[a].peso) return PESOS[b].peso - PESOS[a].peso;
    return PILAR_ORDER.indexOf(a) - PILAR_ORDER.indexOf(b);
  });
  const fortes = strongCandidates.slice(0, 2);

  const usedFeedback = {};
  const cards = top3.map(p => {
    let assigned = null;
    [fb1, fb2].forEach(fb => {
      if (!fb || usedFeedback[fb.id] || assigned) return;
      if (fb.principal === p) assigned = fb;
    });
    if (!assigned) {
      [fb1, fb2].forEach(fb => {
        if (!fb || usedFeedback[fb.id] || assigned) return;
        if (fb.relacionados.indexOf(p) !== -1) assigned = fb;
      });
    }
    if (assigned) usedFeedback[assigned.id] = true;
    const score = scores[p];
    const basico = FEEDBACKS_BASICOS[p + '|' + score] || null;
    const content = buildPriorityCardContent(p, assigned, basico);
    return { pilar: p, regra: assigned, basico: basico, blocked: !!blockedForP1[p], score: score, content: content };
  });

  // Principal ponto de atenção: bloco separado da descrição do estágio (não concatenar).
  // Usa a regra combinada mais precedente elegível e relacionada ao Top 3.
  // O texto vem diretamente da coluna J (attentionText) de Feedbacks_Combinados_NC — sem overrides locais.
  const attentionRule = active
    .filter(r => FEEDBACKS_COMB[r.id] && FEEDBACKS_COMB[r.id].usarSintese)
    .filter(r => top3.indexOf(r.principal) !== -1 || r.relacionados.some(x => top3.indexOf(x) !== -1))
    .sort((a, b) => a.precedencia - b.precedencia || (a.id < b.id ? -1 : 1))[0] || null;
  const attentionText = attentionRule ? FEEDBACKS_COMB[attentionRule.id].attentionText : null;

  // Plano de ação: usa exclusivamente Hoje/7/30 da prioridade 1 (regra combinada ou fallback básico)
  let plano = null;
  if (cards[0]) {
    if (cards[0].regra && CHECKLISTS_COMB[cards[0].regra.id]) {
      const chk = CHECKLISTS_COMB[cards[0].regra.id];
      plano = { hoje: chk.hoje, d7: chk.d7, d30: chk.d30 };
    } else if (cards[0].basico) {
      plano = { hoje: cards[0].basico.hoje, d7: cards[0].basico.d7, d30: cards[0].basico.d30 };
    }
  }

  return {
    notaGeral, notaPilar, estagio, active, bonusCombinado,
    scorePrioridade, scoreTrue, blockedForP1, top3, fb1, fb2, fortes, cards,
    attentionRule, attentionText, plano
  };
}

   MONTAGEM COERENTE DOS CARDS DE PRIORIDADE (fonte única por card)
   ============================================================ */
// buildPriorityCardContent(pilar, selectedRule, basicFallback):
// Para sourceType "combined", título e "por que importa" vêm de Feedbacks_Combinados_NC
// (colunas C e E — nunca a coluna D, que é apenas contexto interno); primeiro passo e
// resultado esperado vêm do checklist "Hoje" da MESMA Regra_ID.
// Para sourceType "basic_fallback", todos os campos vêm da mesma linha de Feedbacks_Basicos_NC.
function buildPriorityCardContent(pilar, selectedRule, basico) {
  if (selectedRule) {
    const fb = FEEDBACKS_COMB[selectedRule.id];
    const chk = CHECKLISTS_COMB[selectedRule.id] || {};
    return {
      title: fb.titulo,               // coluna C
      motive: fb.porqueImporta,       // coluna E — nunca a coluna D (textoPrincipal)
      firstStep: chk.hoje || '',      // checklist "Hoje" da mesma Regra_ID
      expectedResult: chk.resultado || '', // resultado esperado do checklist da mesma Regra_ID
      sourceType: 'combined',
      ruleId: selectedRule.id,
      feedbackId: fb.id,
      checklistId: chk.hoje_id || null
    };
  }
  if (basico) {
    return {
      title: basico.titulo,
      motive: basico.porque,
      firstStep: basico.hoje,
      expectedResult: basico.resultado,
      sourceType: 'basic_fallback',
      ruleId: null,
      feedbackId: null,
      checklistId: null
    };
  }
  return { title: '', motive: '', firstStep: '', expectedResult: '', sourceType: 'basic_fallback', ruleId: null, feedbackId: null, checklistId: null };
}

/* ============================================================
   NORMALIZAÇÃO E SIMILARIDADE DE TEXTO (usadas pelos testes editoriais)
   ============================================================ */
function normalize(text) {
  if (!text) return '';
  return text
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .replace(/[^\w\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Similaridade por sobreposição de tokens (Jaccard). Retorna 0–1.
function textSimilarity(a, b) {
  const ta = normalize(a).split(' ').filter(Boolean);
  const tb = normalize(b).split(' ').filter(Boolean);
  if (ta.length === 0 || tb.length === 0) return 0;
  const setA = new Set(ta);
  const setB = new Set(tb);
  let intersect = 0;
  setA.forEach(w => { if (setB.has(w)) intersect++; });
  const union = new Set([...setA, ...setB]).size;
  return union === 0 ? 0 : intersect / union;
}

/* ============================================================
   PERSISTÊNCIA DE PROGRESSO (localStorage protegido)
   ============================================================ */
function safeLocalStorageGet(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
function safeLocalStorageSet(key, value) {
  try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
}
function safeLocalStorageRemove(key) {
  try { window.localStorage.removeItem(key); return true; } catch (e) { return false; }
}

function saveProgress(state) {
  try {
    const payload = {
      answers: answers,
      currentQuestionId: flow[step] ? flow[step].id : null,
      currentQuestionIndex: step,
      state: state,
      updatedAt: new Date().toISOString(),
      methodologyVersion: METHODOLOGY_VERSION,
      dataSchemaVersion: DATA_SCHEMA_VERSION,
      completed: state === 'result_completed',
      // Apenas status, data e ID do formulário. Nunca nome, e-mail, telefone,
      // empresa, consentimento ou qualquer conteúdo digitado no formulário.
      leadGate: { submitted: leadGate.submitted, submittedAt: leadGate.submittedAt, formId: leadGate.formId }
    };
    safeLocalStorageSet(STORAGE_KEY, JSON.stringify(payload));
    trackEvent('progresso_salvo', { progress_state: state, step: step });
    if (DEBUG) updateQuizDebug(payload.currentQuestionId);
  } catch (e) { /* indisponibilidade de localStorage não pode travar o diagnóstico */ }
}

function loadProgress() {
  const raw = safeLocalStorageGet(STORAGE_KEY);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return { __corrupted: true }; }
}

function clearProgress() {
  safeLocalStorageRemove(STORAGE_KEY);
}

function isProgressValid(raw) {
  if (!raw || raw.__corrupted) return { valid: false, reason: 'invalid_data' };
  if (!raw.updatedAt || !raw.state || !raw.answers) return { valid: false, reason: 'invalid_data' };
  if (raw.methodologyVersion !== METHODOLOGY_VERSION || raw.dataSchemaVersion !== DATA_SCHEMA_VERSION) {
    return { valid: false, reason: 'incompatible_version' };
  }
  const updated = new Date(raw.updatedAt).getTime();
  if (isNaN(updated)) return { valid: false, reason: 'invalid_data' };
  const ageDays = (Date.now() - updated) / (1000 * 60 * 60 * 24);
  if (ageDays > PROGRESS_MAX_AGE_DAYS) return { valid: false, reason: 'expired' };
  return { valid: true, reason: null };
}

function restoreProgress(raw) {
  Object.keys(answers).forEach(k => delete answers[k]);
  Object.assign(answers, raw.answers);
  step = typeof raw.currentQuestionIndex === 'number' ? raw.currentQuestionIndex : 0;
  history.length = 0;
  for (let i = 0; i <= step; i++) history.push(i);
  if (raw.leadGate) {
    leadGate.submitted = !!raw.leadGate.submitted;
    leadGate.submittedAt = raw.leadGate.submittedAt || null;
    leadGate.formId = raw.leadGate.formId || HUBSPOT_FORM_ID;
  } else {
    resetLeadGate();
  }
}

function discardLegacyProgress() {
  // Qualquer estado salvo por uma versão anterior (chave antiga) é sempre incompatível.
  LEGACY_STORAGE_KEYS.forEach(key => {
    const raw = safeLocalStorageGet(key);
    if (raw) {
      safeLocalStorageRemove(key);
      trackEvent('progresso_descartado', { discard_reason: 'incompatible_version' });
    }
  });
}

function showResumePrompt() {
  discardLegacyProgress();
  const raw = loadProgress();
  if (!raw) return;
  const check = isProgressValid(raw);
  if (!check.valid) {
    clearProgress();
    trackEvent('progresso_descartado', { discard_reason: check.reason });
    return;
  }
  trackEvent('progresso_encontrado', { progress_state: raw.state });
  if (raw.state === 'result_completed') {
    renderModal({
      title: 'Seu último diagnóstico está disponível',
      body: 'Você pode consultar novamente seu resultado ou responder ao diagnóstico desde o início.',
      primary: { label: 'Ver meu resultado', action: () => {
        removeModal();
        restoreProgress(raw);
        document.getElementById('intro-section').classList.add('hidden');
        const result = computeResult(scoresFromAnswers());

        trackEvent('resultado_salvo_reaberto', {});
      }},
      secondary: { label: 'Refazer diagnóstico', action: () => {

        step = 0; history.length = 0;

        trackEvent('diagnostico_refeito', {});
      }}
    });
  } else if (raw.state === 'lead_gate_pending') {
    renderModal({

      primary: { label: 'Continuar', action: () => {
        removeModal();

        const result = computeResult(scoresFromAnswers());
        showLeadGate(result);
        trackEvent('progresso_retomado', { step: step, progress_state: raw.state });
      }},
      secondary: { label: 'Refazer diagnóstico', action: () => {
        removeModal();
        clearProgress();
        Object.keys(answers).forEach(k => delete answers[k]);
        step = 0; history.length = 0;
        resetLeadGate();
        trackEvent('diagnostico_refeito', {});
      }}
    });
  } else {
    renderModal({
      title: 'Você já começou este diagnóstico',
      body: 'Encontramos respostas salvas neste navegador. Você pode continuar de onde parou ou começar novamente.',
      primary: { label: 'Continuar de onde parei', action: () => {
        removeModal();
        restoreProgress(raw);
        document.getElementById('intro-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        trackEvent('progresso_retomado', { step: step });
        renderQuiz();
      }},
      secondary: { label: 'Começar novamente', action: () => {
        removeModal();
        clearProgress();
        trackEvent('progresso_descartado', { discard_reason: 'user_choice' });
        Object.keys(answers).forEach(k => delete answers[k]);
        step = 0; history.length = 0; advancing = false;
        resetLeadGate();
        document.getElementById('intro-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        trackEvent('diagnostico_iniciado', {});
        saveProgress('quiz_in_progress');
        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }}
    });
  }
}

function scoresFromAnswers() {
  const scores = {};
  PILAR_ORDER.forEach(p => {
    const q = QUESTIONS.find(x => x.pilar === p);
    scores[p] = q && answers[q.id] ? answers[q.id].score : 0;
  });

function renderQuiz() {
  if (step >= flow.length) { showProcessing(); return; }
  if (history[history.length - 1] !== step) history.push(step);
  const q = flow[step];
  const container = document.getElementById('quiz');
  const total = flow.length;
  const pct = Math.round(((step + 1) / total) * 100);
  const opts = q.opts;
  const showBack = step > 0;

  let preSel = -1;
  if (answers[q.id]) {
    preSel = q.opts.findIndex(o => o[1] === answers[q.id].score);
  }

  trackEvent('pergunta_visualizada', { question_id: q.id, step: step + 1 });

  container.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-topbar"><span>Pergunta ${step + 1} de ${total}</span></div>
      <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <h2 class="quiz-q">${q.q}</h2>
      <div class="opts" role="radiogroup" aria-label="Escolha uma opção">
        ${opts.map((o, i) => `
          <button type="button" class="opt${i === preSel ? ' selected' : ''}" data-i="${i}" role="radio" aria-checked="${i === preSel ? 'true' : 'false'}">
            <span class="radio" aria-hidden="true"></span><span class="opt-text">${o[0]}</span>
          </button>
        `).join('')}
      </div>
      ${showBack ? '<div class="quiz-nav"><button class="btn btn-ghost" id="back-btn" type="button">← Voltar</button></div>' : ''}
    </div>
  `;

  const focusTarget = container.querySelector(preSel >= 0 ? `.opt[data-i="${preSel}"]` : '.opt');
  if (focusTarget) focusTarget.focus({ preventScroll: true });

  container.querySelectorAll('.opt').forEach(b => {
    b.addEventListener('click', () => selectOption(b, q));
    b.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectOption(b, q); }
    });
  });
  const backBtn = document.getElementById('back-btn');
  if (backBtn) backBtn.addEventListener('click', goBack);

  if (DEBUG) updateQuizDebug(q.id);
}

function updateQuizDebug(visibleQuestionId) {
  const raw = loadProgress();
  const savedQuestionId = raw ? raw.currentQuestionId : null;
  window.__diagnosticoDebug = Object.assign({}, window.__diagnosticoDebug, {
    methodologyVersion: METHODOLOGY_VERSION,
    dataSchemaVersion: DATA_SCHEMA_VERSION,
    storageKey: STORAGE_KEY,
    questionCount: QUESTIONS.length,
    questionIds: QUESTIONS.map(q => q.id),
    hasNC11: QUESTIONS.some(q => q.id === 'NC11'),
    hasObjective: false,
    activeRuleCount: REGRAS.length,
    hasRC22: REGRAS.some(rg => rg.id === 'RC22'),
    hasRC23: REGRAS.some(rg => rg.id === 'RC23'),
    currentQuestionId: visibleQuestionId,
    currentIndex: step,
    visibleQuestionId: visibleQuestionId,
    savedQuestionId: savedQuestionId,
    savedQuestionMatchesVisibleQuestion: savedQuestionId === visibleQuestionId,
    progressState: raw ? raw.state : null,
    progressUpdatedAt: raw ? raw.updatedAt : null
  });
}

let advancing = false;
function selectOption(button, q) {
  if (advancing) return;
  advancing = true;
  const i = +button.dataset.i;
  const container = document.getElementById('quiz');
  container.querySelectorAll('.opt').forEach(x => { x.classList.remove('selected'); x.setAttribute('aria-checked', 'false'); });
  button.classList.add('selected');
  button.setAttribute('aria-checked', 'true');

  const existing = answers[q.id];
  const isNew = !existing;
  const novoScore = q.opts[i][1];
  const changed = existing && existing.score !== novoScore;
  answers[q.id] = { pilar: q.pilar, score: novoScore };

  if (isNew) {
    trackEvent('pergunta_respondida', { question_id: q.id, step: step + 1, answer_score: novoScore });
  } else if (changed) {
    trackEvent('resposta_alterada', { question_id: q.id, step: step + 1 });
  }

  saveProgress('quiz_in_progress'); // salva a resposta imediatamente (ainda na tela atual)
  setTimeout(() => {
    step++;
    advancing = false;
    renderQuiz();
    // Se ainda há pergunta (não foi para processamento), salva de novo já com a tela visível atualizada.
    if (step < flow.length) saveProgress('quiz_in_progress');
  }, 220);
}

function goBack() {
  if (history.length < 2) return;
  history.pop();
  step = history.pop();
  advancing = false;
  renderQuiz();
  saveProgress('quiz_in_progress');
}

function showProcessing() {
  document.getElementById('quiz-section').classList.add('hidden');

  proc.classList.remove('hidden');
  saveProgress('processing');
  const steps = [
    { label: 'Organizando suas respostas', icon: 'fa-inbox' },
    { label: 'Identificando os principais pontos de atenção', icon: 'fa-magnifying-glass' },
    { label: 'Cruzando informações da sua rotina financeira', icon: 'fa-diagram-project' },
    { label: 'Montando suas prioridades', icon: 'fa-ranking-star' },
    { label: 'Preparando seu plano de ação', icon: 'fa-clipboard-list' },
    { label: 'Finalizando seu diagnóstico', icon: 'fa-circle-check' }
  ];
  const container = document.getElementById('processing');
  container.innerHTML = `
    <div class="processing-wrap">
      <h2 class="processing-title">Estamos preparando seu diagnóstico</h2>
      <p class="processing-subtitle">Isso leva só alguns segundos.</p>
      <div class="proc-steps" role="status" aria-live="polite">
        ${steps.map((s, i) => `
          <div class="proc-step${i === 0 ? ' active' : ''}" data-step="${i}">
            <span class="indicator" aria-hidden="true"><i class="fa-solid ${s.icon}"></i></span>
            <span>${s.label}</span>
          </div>
        `).join('')}
      </div>
      <div class="proc-progress-track"><div class="proc-progress-fill" id="proc-progress-fill" style="width:0%"></div></div>
    </div>
  `;
  const nodes = container.querySelectorAll('.proc-step');
  const fill = document.getElementById('proc-progress-fill');
  const stepDuration = 620;
  nodes.forEach((n, i) => {
    setTimeout(() => {
      nodes.forEach((m, j) => {
        m.classList.remove('active');
        const indicator = m.querySelector('.indicator');
        if (j < i) {
          m.classList.add('done');
          indicator.innerHTML = '';
        } else if (j === i) {
          m.classList.add('active');
        }
      });
      if (fill) fill.style.width = Math.round(((i + 1) / steps.length) * 100) + '%';
    }, i * stepDuration);
  });
  setTimeout(() => {
    nodes.forEach(n => {
      n.classList.remove('active'); n.classList.add('done');
      const indicator = n.querySelector('.indicator');
      if (indicator) indicator.innerHTML = '';
    });
    if (fill) fill.style.width = '100%';
  }, steps.length * stepDuration);
  setTimeout(() => {
    trackEvent('diagnostico_concluido', { question_count: QUESTIONS.length });
    const scores = scoresFromAnswers();
    const result = computeResult(scores);
    saveProgress('lead_gate_pending');
    showLeadGate(result);
  }, steps.length * stepDuration + 500);
}

   RENDERIZAÇÃO DO RESULTADO

function nivelIdx(m) { return m < 25 ? 0 : m < 50 ? 1 : m < 75 ? 2 : 3; }

/* ============================================================
   GRÁFICO ARANHA / RADAR (SVG nativo — sem canvas, sem Chart.js, sem D3)
   ============================================================ */
const RADAR_COLORS = {
  background: '#FFFFFF',
  grid: '#D6E1F0',
  axis: '#B8CCEA',
  fillColor: '#0072CE',
  fillOpacity: 0.18,
  stroke: '#0072CE',
  point: '#002D72',
  pointBorder: '#FFFFFF',
  focus: '#41B6E6',
  label: '#2C2C2A',
  helperText: '#5F5E5A',
  cardBorder: '#E5EDF7'
};

const RADAR_SCORE_VOCAB = {
  0: 'Ainda não realizado',
  1: 'Controle inicial',
  2: 'Rotina organizada',
  3: 'Prática consolidada'
};

// Rótulos que podem quebrar em duas linhas no radar (tspan)
const RADAR_TWO_LINE_LABELS = {
  PAG: ['Contas a', 'pagar'],
  REC: ['Contas a', 'receber'],
  CAI: ['Previsão de', 'caixa']
};

let lastRadarRender = null; // exposto para debug e testes

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
  return el;
}

function renderMaturityRadar(scores) {
  const svg = document.getElementById('maturityRadar');
  if (!svg) return;

  // 1. Limpa qualquer desenho anterior, preservando title/desc já existentes no template.
  Array.from(svg.querySelectorAll('.radar-generated')).forEach(el => el.remove());

  const width = 760, height = 680;
  const centerX = width / 2;
  const centerY = 330;
  const maxRadius = 230;
  const axes = PILAR_ORDER.slice(); // mesma ordem das perguntas: DAD,SEP,PAG,REC,BAN,CAI,CUS,ANA,PLA,PRE
  const n = axes.length;

  function pointFor(index, radius) {
    const angle = -Math.PI / 2 + index * (2 * Math.PI / n);
    return {
      x: centerX + Math.cos(angle) * radius,
      y: centerY + Math.sin(angle) * radius,
      angle: angle
    };
  }

  const group = svgEl('g', { class: 'radar-generated' });

  // 2. Anéis da grade (score 1, 2 e 3)
  [1, 2, 3].forEach(ring => {
    const r = maxRadius * (ring / 3);
    const pts = axes.map((_, i) => pointFor(i, r)).map(p => `${p.x},${p.y}`).join(' ');
    group.appendChild(svgEl('polygon', {
      points: pts, fill: 'none', stroke: RADAR_COLORS.grid, 'stroke-width': '1.5'
    }));
  });

  // 3. Eixos (linhas do centro até a borda de cada pilar)
  axes.forEach((_, i) => {
    const p = pointFor(i, maxRadius);
    group.appendChild(svgEl('line', {
      x1: centerX, y1: centerY, x2: p.x, y2: p.y, stroke: RADAR_COLORS.axis, 'stroke-width': '1.5'
    }));
  });

  // 4 e 5. Calcula os pontos do resultado e desenha o polígono
  const pointCoordinates = axes.map((pilar, i) => {
    const score = scores[pilar] || 0;
    const p = pointFor(i, maxRadius * (score / 3));
    return { pilar: pilar, score: score, x: p.x, y: p.y };
  });
  const polygonPoints = pointCoordinates.map(p => `${p.x},${p.y}`).join(' ');
  group.appendChild(svgEl('polygon', {
    points: polygonPoints, fill: RADAR_COLORS.fillColor, 'fill-opacity': String(RADAR_COLORS.fillOpacity),
    stroke: RADAR_COLORS.stroke, 'stroke-width': '3', 'stroke-linejoin': 'round'
  }));

  // 6. Marcadores dos dez pontos + 8. <title> por ponto
  pointCoordinates.forEach((p, i) => {
    const label = RADAR_LABELS[p.pilar] || p.pilar;
    const marker = svgEl('circle', {
      cx: p.x, cy: p.y, r: '6', fill: RADAR_COLORS.point, stroke: RADAR_COLORS.pointBorder,
      'stroke-width': '2', class: 'radar-point', tabindex: '0', role: 'img',
      'aria-label': `${label}: ${RADAR_SCORE_VOCAB[p.score]}`
    });
    const title = svgEl('title', {});
    title.textContent = `${label}: ${RADAR_SCORE_VOCAB[p.score]}`;
    marker.appendChild(title);
    marker.addEventListener('mouseenter', () => marker.setAttribute('fill', RADAR_COLORS.focus));
    marker.addEventListener('mouseleave', () => marker.setAttribute('fill', RADAR_COLORS.point));
    marker.addEventListener('focus', () => marker.setAttribute('fill', RADAR_COLORS.focus));
    marker.addEventListener('blur', () => marker.setAttribute('fill', RADAR_COLORS.point));
    group.appendChild(marker);
  });

  // 7. Rótulos externos ao polígono, alinhados conforme o lado do gráfico
  axes.forEach((pilar, i) => {
    const labelRadius = maxRadius + 42;
    const p = pointFor(i, labelRadius);
    const cosA = Math.cos(p.angle);
    let anchor = 'middle';
    if (cosA > 0.15) anchor = 'start';
    else if (cosA < -0.15) anchor = 'end';
    const text = svgEl('text', {
      x: p.x, y: p.y, 'text-anchor': anchor, 'dominant-baseline': 'middle',
      fill: RADAR_COLORS.label, 'font-family': "'Poppins', sans-serif", 'font-size': '13'
    });
    const twoLine = RADAR_TWO_LINE_LABELS[pilar];
    if (twoLine) {
      const tspan1 = svgEl('tspan', { x: p.x, dy: '-0.35em' });
      tspan1.textContent = twoLine[0];
      const tspan2 = svgEl('tspan', { x: p.x, dy: '1.15em' });
      tspan2.textContent = twoLine[1];
      text.appendChild(tspan1);
      text.appendChild(tspan2);
    } else {
      text.textContent = RADAR_LABELS[pilar] || pilar;
    }
    group.appendChild(text);
  });

  svg.appendChild(group);

  // 9. Resumo acessível (sr-only) — o SVG não é a única forma de acessar os dados.
  const summaryEl = document.getElementById('radarAccessibleSummary');
  if (summaryEl) {
    const items = pointCoordinates.map(p => `${RADAR_LABELS[p.pilar] || p.pilar}: ${RADAR_SCORE_VOCAB[p.score]}`);
    summaryEl.textContent = 'Como está cada área da sua gestão financeira. ' + items.join('. ') + '.';
  }

  // 10. Expõe os dados para o modo debug e para os testes automáticos.
  lastRadarRender = {
    axes: axes,
    scores: axes.map(p => scores[p] || 0),
    labels: axes.map(p => RADAR_LABELS[p] || p),
    colors: RADAR_COLORS,
    pointCoordinates: pointCoordinates
  };
}
