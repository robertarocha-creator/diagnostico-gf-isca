function wireResultInteractions(r) {

  const niboBtn = document.getElementById('nibo-cta-btn');

        stage_id: r.estagio.interno, priority_ids: r.top3
      });
    });
  }

  let evalChoice = null;
  document.querySelectorAll('.eval-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.eval-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      evalChoice = btn.dataset.v;
      document.getElementById('eval-submit').classList.remove('hidden');
      document.getElementById('eval-followup').classList.toggle('hidden', evalChoice === 'representa');
    });
  });
  document.getElementById('eval-submit').addEventListener('click', () => {
    if (!evalChoice) return;
    trackEvent('avaliacao_resultado_enviada', {
      opcao: evalChoice, stage_id: r.estagio.interno, priority_ids: r.top3, methodology_version: METHODOLOGY_VERSION
    });
    document.getElementById('eval-confirm').classList.remove('hidden');
    document.getElementById('eval-submit').classList.add('hidden');
    document.getElementById('eval-text').value = ''; // não persistir texto livre
  });

    const fb2Ok = !s.fb2Esperado || (r.fb2 && r.fb2.id === s.fb2Esperado);
    const pass = notaOk && estagioOk && top3Ok && forte1Ok && forte2Ok && fb1Ok && fb2Ok;
    return {
      id: s.id, nome: s.nome, status: pass ? 'PASS' : 'FAIL',

  });
  console.table(results);
  const passCount = results.filter(r => r.status === 'PASS').length;
  console.log(`${passCount}/${results.length} cenários PASS`);
  return results;
};

/* ============================================================
   TESTES DE SALVAMENTO DE PROGRESSO
   ============================================================ */
window.runProgressTests = function () {
  const originalRaw = safeLocalStorageGet(STORAGE_KEY);
  const originalAnswers = Object.assign({}, answers);
  const originalStep = step;
  const originalHistory = history.slice();
  const log = [];
  function check(name, cond) { log.push({ teste: name, status: cond ? 'PASS' : 'FAIL' }); }

  try {
    clearProgress();
    Object.keys(answers).forEach(k => delete answers[k]);
    step = 0; history.length = 0;

    // 1-5: responder 4 perguntas, salvar, "recarregar", continuar da 5ª
    for (let i = 0; i < 4; i++) { answers[QUESTIONS[i].id] = { pilar: QUESTIONS[i].pilar, score: 2 }; step = i + 1; saveProgress('quiz_in_progress'); }
    let raw = loadProgress();
    check('salvar progresso após responder 4 perguntas', !!raw && Object.keys(raw.answers).length === 4);
    const validCheck = isProgressValid(raw);
    check('progresso válido após recarregar', validCheck.valid);
    restoreProgress(raw);
    check('continuar da 5ª pergunta', step === 4);
    check('confirma as 4 respostas anteriores', Object.keys(answers).length === 4);

    // 6-9: voltar, alterar resposta, recarregar, confirmar alteração
    step = 3; history.push(3);
    answers[QUESTIONS[3].id] = { pilar: QUESTIONS[3].pilar, score: 0 };
    saveProgress('quiz_in_progress');
    raw = loadProgress();
    check('recarregar após alterar resposta', raw.answers[QUESTIONS[3].id].score === 0);

    // 10-11: descartar progresso, começar novamente
    clearProgress();
    check('descartar progresso', loadProgress() === null);

    // 12-14: diagnóstico concluído — restaurar, abrir resultado, limpar ao refazer
    Object.keys(answers).forEach(k => delete answers[k]);
    QUESTIONS.forEach(q => { answers[q.id] = { pilar: q.pilar, score: 2 }; });
    step = flow.length;
    saveProgress('result_completed');
    raw = loadProgress();
    check('restaurar diagnóstico concluído', raw.state === 'result_completed');
    check('estado salvo não contém objective', !('objective' in raw));
    const r = computeResult(scoresFromAnswers());
    check('recalcular resultado ao abrir', !!r.estagio);
    clearProgress();
    check('limpar estado ao refazer', loadProgress() === null);

    // 15: expiração
    const oldPayload = JSON.parse(JSON.stringify(raw));
    oldPayload.updatedAt = new Date(Date.now() - 31 * 24 * 60 * 60 * 1000).toISOString();
    safeLocalStorageSet(STORAGE_KEY, JSON.stringify(oldPayload));
    check('ignorar progresso expirado', !isProgressValid(loadProgress()).valid && isProgressValid(loadProgress()).reason === 'expired');
    clearProgress();

    // 16: incompatibilidade de versão
    const incompatPayload = JSON.parse(JSON.stringify(oldPayload));
    incompatPayload.updatedAt = new Date().toISOString();
    incompatPayload.dataSchemaVersion = '0';
    safeLocalStorageSet(STORAGE_KEY, JSON.stringify(incompatPayload));
    check('ignorar progresso incompatível', isProgressValid(loadProgress()).reason === 'incompatible_version');
    clearProgress();

    // 17: dados corrompidos
    safeLocalStorageSet(STORAGE_KEY, '{invalid json');
    const corrupted = loadProgress();
    check('ignorar progresso corrompido', corrupted && corrupted.__corrupted === true);
    clearProgress();

    // 18: funcionar sem localStorage (simulado desativando temporariamente)
    const realSetItem = window.localStorage.setItem;
    try {
      window.localStorage.setItem = function () { throw new Error('indisponível'); };
      let threw = false;
      try { saveProgress('quiz_in_progress'); } catch (e) { threw = true; }
      check('continuar funcionando sem localStorage', !threw);
    } finally {
      window.localStorage.setItem = realSetItem;
    }
  } finally {
    // Restaura estado real do usuário
    if (originalRaw === null) { clearProgress(); } else { safeLocalStorageSet(STORAGE_KEY, originalRaw); }
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.assign(answers, originalAnswers);
    step = originalStep;
    history.length = 0;
    originalHistory.forEach(h => history.push(h));
  }

  console.table(log);
  const passCount = log.filter(l => l.status === 'PASS').length;
  console.log(`${passCount}/${log.length} testes de progresso PASS`);
  return log;
};

/* ============================================================
   TESTES DA BIBLIOTECA EDITORIAL (55 registros: 25 combinados + 30 fallbacks)
   ============================================================ */
window.runEditorialTests = function () {
  const SIMILARITY_LIMIT = 0.75;
  const codeRegex = /\b(DAD|BAN|CAI|CUS|ANA|PLA|PRE|SEP|PAG|REC)\b/;
  const stageTexts = ESTAGIOS.map(e => e.texto);

  const results = EDITORIAL_TESTS.map(entry => {
    const title = entry.titulo;
    const motive = entry.porque;
    const firstStep = entry.passo;
    const expectedResult = entry.resultado;

    const titleMotive = normalize(title) !== normalize(motive);
    const motiveResult = normalize(motive) !== normalize(expectedResult);
    const stepResult = normalize(firstStep) !== normalize(expectedResult);
    const similarity = textSimilarity(title, motive);
    const similarityOk = similarity < SIMILARITY_LIMIT;

    let attentionPrefixOk = true, attentionActionOk = true, attentionNoStage = true, attentionNotTitle = true, attentionNoCodes = true;
    if (entry.tipo === 'Combinado') {
      const attention = entry.atencao;
      attentionPrefixOk = !/^O principal ponto de atenção/i.test(attention || '');
      attentionActionOk = !!attention && attention.trim().length > 10;
      attentionNoStage = !stageTexts.some(st => attention && attention.indexOf(st) !== -1);
      attentionNotTitle = normalize(attention) !== normalize(title);
      attentionNoCodes = !codeRegex.test(attention || '');
    }

    const pass = titleMotive && motiveResult && stepResult && similarityOk &&
      attentionPrefixOk && attentionActionOk && attentionNoStage && attentionNotTitle && attentionNoCodes;

    return {
      tipo: entry.tipo, id: entry.id, status: pass ? 'PASS' : 'FAIL',
      'título≠motivo': titleMotive, 'motivo≠resultado': motiveResult, 'passo≠resultado': stepResult,
      similaridade: Number(similarity.toFixed(3)), similaridadeOk: similarityOk,
      atençãoSemPrefixo: attentionPrefixOk, atençãoAcionável: attentionActionOk,
      atençãoSemEstágio: attentionNoStage, atençãoNãoÉTítulo: attentionNotTitle, atençãoSemCódigos: attentionNoCodes
    };
  });

  console.table(results);
  const passCount = results.filter(r => r.status === 'PASS').length;
  console.log(`${passCount}/${results.length} testes editoriais PASS`);
  return results;
};

    const modalPrimary = document.getElementById('modal-primary');
    if (modalPrimary) modalPrimary.dispatchEvent(new Event('click', { bubbles: true }));
    check('Ao continuar, abre o formulário (não o resultado)', !document.getElementById('lead-form-section').classList.contains('hidden') && document.getElementById('result-section').classList.contains('hidden'), true, `leadFormHidden=${document.getElementById('lead-form-section').classList.contains('hidden')} resultHidden=${document.getElementById('result-section').classList.contains('hidden')}`);

    // ---- 9. "Refazer diagnóstico" limpa o leadGate ----
    leadGate.submitted = true;
    leadGate.submittedAt = new Date().toISOString();
    document.getElementById('restart-btn').dispatchEvent(new Event('click', { bubbles: true }));
    check('"Refazer diagnóstico" (resultado) zera leadGate.submitted', leadGate.submitted === false, false, leadGate.submitted);
    check('"Refazer diagnóstico" (resultado) zera leadGate.submittedAt', leadGate.submittedAt === null, null, leadGate.submittedAt);

  } finally {
    window.hbspt = originalHbspt;
    if (originalRaw === null) { clearProgress(); } else { safeLocalStorageSet(STORAGE_KEY, originalRaw); }
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.assign(answers, originalAnswers);
    step = originalStep;
    leadGate.submitted = originalLeadGate.submitted;
    leadGate.submittedAt = originalLeadGate.submittedAt;
    leadGate.formId = originalLeadGate.formId;
    pendingDiagnosisResult = null;
    removeModal();
    document.getElementById('result-content').innerHTML = resultContentBackup;
    document.getElementById('lead-form-section').innerHTML = leadFormBackup;
    document.getElementById('result-section').classList.toggle('hidden', !wasResultVisible);
    document.getElementById('lead-form-section').classList.toggle('hidden', !wasLeadFormVisible);
    document.getElementById('quiz-section').classList.add('hidden');
    document.getElementById('processing-section').classList.add('hidden');
    document.getElementById('intro-section').classList.add('hidden');
  }

  console.table(log);
  const passCount4 = log.filter(l => l.status === 'PASS').length;
  console.log(`${passCount4}/${log.length} testes do formulário HubSpot PASS`);
  return log;
};

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
window.addEventListener('beforeunload', () => {
  const quizVisible = document.getElementById('quiz-section') && !document.getElementById('quiz-section').classList.contains('hidden');
  const resultVisible = document.getElementById('result-section') && !document.getElementById('result-section').classList.contains('hidden');
  if (quizVisible && !resultVisible) {
    trackEvent('diagnostico_abandonado', { step: step + 1, total: flow.length });
  }
});

trackEvent('diagnostico_visualizado', {});
showResumePrompt();
if (DEBUG) { console.log('Modo debug ativo. Use window.__diagnosticoDebug, window.runDiagnosticoTests(), window.runProgressTests(), window.runV10Tests(), window.runEditorialTests(), window.runScenarioEditorialTests(), window.runRadarTests(), window.runVisualTextTests(), window.runLeadGateTests().'); }

</script>
